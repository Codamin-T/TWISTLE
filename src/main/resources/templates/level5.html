<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{level5.css}">
    <link rel="stylesheet" th:href="@{winPopup.css}">
    <link rel="stylesheet" th:href="@{losePopup.css}">
    <link rel="stylesheet" th:href="@{instructionsPopup.css}">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <title>Five letters</title>
</head>
<body>
<h1>5 letters</h1>
<div class = "flex-container">
    <div>
        <aside class="sidebar">
            <a th:if="${loggedInUser != null}" class="side-item">
                🥉Streak
            </a>
            <a th:if="${loggedInUser != null}" class="side-item" id="pointsUpdated">
                ⭐ Score: <span th:text="${points}" id="points"></span>
            </a>
        </aside>
    </div>
    <!--<aside class="info">
      <input type="checkbox" id="toggle">
      <label for="toggle" class="toggle">
        ❔
      </label>

      <div class="how-to-play">
        <p>
          This is the eight letter game.
          After each guess, the letters will turn different colors.
          Green means that the letter is in the correct spot.
          Yellow means that the letter exists in the word, but is in the incorrect spot.
          Grey means that the letter does not exist in the word.
        </p>
      </div>
    </aside>-->
    <a th:if="${loggedInUser != null}" th:href="@{/logout}" class="logout-button" style="font-size:3.5vh">
        Logout (🍬 <span th:text="${loggedInUser}"></span>)
    </a>
</div>

<div id="game" data-length="5" data-rows="6" class="container">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>


    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<div th:replace="winPopup :: winPopup"></div>
<div th:replace="losePopup :: losePopup"></div>

<div class="instructions-modal" id="instructionsModal" style="display:none">
    <div class="modal-header">
        <div class="title">How to Play</div>
        <button class="close-button" id="instructionsCloseButton">&times;</button>
    </div>
    <div class="modal-body">
        <p>Guess the hidden word before you run out of tries!</p>
        <br>
        <p>🟢 <strong>Green</strong> — correct letter, correct spot</p>
        <p>🟡 <strong>Yellow</strong> — correct letter, wrong spot</p>
        <p>⚫ <strong>Grey</strong> — letter not in the word</p>
        <p>🟠 <strong>Orange</strong> — letter is in correct spot, via hint</p>
        <br>
        <button class="close-instructions-btn" id="instructionsGotItBtn">Got it! 🍬</button>
    </div>
</div>


<a th:href="@{/play}" class="back-button" style="font-size:25px">⬅
</a>

<a th:href="@{/level6}" class="next-level-button" style="font-size:4vh">Next level
</a>

<script th:src="@{/game.js}"></script>

</body>
</html>
